name: Windows reference data

# Generates reference data that needs MSVC.
#
# Two kinds of recipe run here. VX-API needs ATL, BlackBone needs ATL and the
# DIA SDK, and SysWhispers v1 emits MASM that neither nasm nor GAS will
# assemble: those cannot be built with GCC at all. The library recipes whose
# names end in _msvc can be built with GCC - data/ carries the MinGW artefacts
# already - but the corpus wants the MSVC build of the same version beside it,
# because that is the compiler behind most Windows sightings of sqlite3,
# liblzma and lz4. The windows-2022 runner image carries Visual Studio 2022
# with ATL and MFC, four Windows SDKs, ml/ml64, nmake, CMake and the WDK,
# which covers all of them.
#
# The same scripts/build_corpus.py drives this as the Linux side; only the
# toolchain differs. Results are uploaded as artifacts rather than committed,
# so a maintainer reviews them before they enter the corpus.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: Recipes to build (space separated, or "all-msvc")
        required: false
        default: all-msvc
  # push rather than pull_request: a pull_request path filter is evaluated
  # against everything the PR changes, not against the push, so once one of
  # these files is in the branch every later commit re-triggers the job and
  # cancels the run that was already building. On push the filter means what
  # it says.
  push:
    paths:
      - scripts/corpus/recipes/vxapi.py
      - scripts/corpus/recipes/blackbone.py
      - scripts/corpus/recipes/syswhispers.py
      # The MinGW recipes for these three families live in sqlite3.py, xz.py
      # and lz4.py and are deliberately not listed: editing a Linux-side
      # recipe must not spend runner minutes rebuilding the MSVC side.
      - scripts/corpus/recipes/sqlite3_msvc.py
      - scripts/corpus/recipes/xz_msvc.py
      - scripts/corpus/recipes/lz4_msvc.py
      - scripts/corpus/toolchain.py
      - scripts/corpus/build.py
      - scripts/corpus/pipeline.py
      # These decide what the artefacts contain, not merely whether the build
      # runs: baseline.py is the glue filter, smdaify.py the disassembly and
      # symbol handling, recipe.py the naming. A change to any of them that
      # did not rebuild the MSVC families would leave them describing a
      # pipeline this branch no longer has.
      - scripts/corpus/baseline.py
      - scripts/corpus/smdaify.py
      - scripts/corpus/recipe.py
      - .github/workflows/windows-reference-data.yml

permissions:
  contents: read

# Each push supersedes the last, and these jobs take minutes of runner time
# building real software. Without this, a quick succession of fixes leaves
# several runs racing on commits nobody is waiting for any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    strategy:
      # One architecture failing should not hide the other's result.
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: python -m pip install --quiet -r scripts/requirements.txt

      # Puts cl, link, ml/ml64, rc and msbuild on PATH for the chosen target.
      # scripts/corpus/toolchain.py registers the MSVC toolchain from that.
      - name: Set up MSVC (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x64' && 'amd64' || 'x86' }}

      - name: Show detected toolchains
        run: python scripts/build_corpus.py list

      - name: Build
        shell: pwsh
        run: |
          $requested = "${{ github.event.inputs.recipes }}"
          if (-not $requested -or $requested -eq "all-msvc") {
            # The library recipes are the MSVC twins of families data/ already
            # carries under MinGW; both architectures build all of them.
            $recipes = @(
              "VX-API_2.01.015",
              "BlackBone_2023-07-17",
              "sqlite3_3.31.1_msvc",
              "sqlite3_3.50.4_msvc",
              "liblzma_5.4.7_msvc",
              "liblzma_5.8.1_msvc",
              "lz4_1.10.0_msvc")
            # SysWhispers v1 is x64-only: its generator emits MASM for x64.
            if ("${{ matrix.arch }}" -eq "x64") {
              $recipes += "SysWhispers_2021-07-06"
            }
            $requested = $recipes -join " "
          }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python scripts/build_corpus.py build $requested.Split(" ") 2>&1 |
            Tee-Object -FilePath build/build-output.txt
          exit $LASTEXITCODE

      # What the job uploads has to be what the job built. data/ arrives from
      # the checkout already holding the committed artefacts of both
      # architectures, so without this the artifact is indistinguishable from
      # a harvest of whatever happened to be committed - and provenance.json
      # is per-family, not per-architecture, so unpacking both artifacts would
      # leave one leg's records overwritten by the other's copy of the file.
      - name: Scope the artefacts to what this job produced
        if: success()
        shell: pwsh
        run: |
          $py = @'
          import json, os, re, sys

          produced = set(re.findall(r"^OK\s+(\S+)",
                                    open("build/build-output.txt",
                                         encoding="utf-8", errors="replace").read(),
                                    re.M))
          if not produced:
              sys.exit("the build reported no artefacts; nothing to upload")
          print("produced this run: %s" % ", ".join(sorted(produced)))

          arch = sys.argv[1]
          # sqlite3, liblzma and lz4 also hold MinGW artefacts, which this
          # loop prunes out of the working copy along with the other
          # architecture's: what is uploaded has to be what this job built.
          # The consequence for whoever imports the result is that
          # provenance.<arch>.json for those families carries the MSVC
          # records ONLY, so it must be merged into the committed
          # provenance.json key by key - copying it over would delete the
          # MinGW records this job never rebuilt.
          for family in ("VX-API", "BlackBone", "SysWhispers",
                         "sqlite3", "liblzma", "lz4"):
              root = os.path.join("data", family)
              path = os.path.join(root, "provenance.json")
              if not os.path.exists(path):
                  continue
              with open(path, encoding="utf-8") as handle:
                  records = json.load(handle)
              mine = {k: v for k, v in records.items() if k in produced}
              # provenance.json stays, pruned, because Validate reads it - but
              # it is not what gets uploaded. The artifact carries the
              # architecture-named copy instead, so unpacking both artifacts
              # cannot leave one leg's records overwritten by the other's.
              for name in ("provenance.json", "provenance.%s.json" % arch):
                  with open(os.path.join(root, name), "w",
                            encoding="utf-8") as handle:
                      json.dump(mine, handle, indent=2, sort_keys=True)
                      handle.write("\n")
              for dirpath, _, names in os.walk(root):
                  for name in names:
                      stem = name.rsplit(".", 1)[0]
                      if name.endswith((".7z", ".mcrit")) and stem not in produced:
                          os.remove(os.path.join(dirpath, name))
          '@
          $py | python - "${{ matrix.arch }}"

      # Build output goes to build/*.log rather than stdout, so a failure
      # otherwise shows only which command failed and not why. Surfacing the
      # tail of each log here is what makes a red run diagnosable from the
      # job page alone.
      - name: Show build logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem build/*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group::$($_.Name)"
            Get-Content $_.FullName -Tail 60
            Write-Host "::endgroup::"
          }

      # Scoped to the families this workflow produces. Validating all of data/
      # would also re-report the twelve known defects in the pre-existing MSVC
      # entries, so the job could never go green on its own work. By this
      # point the tree holds only what this job built, so this validates the
      # run's own output rather than whatever the checkout carried.
      - name: Validate
        if: success()
        shell: pwsh
        run: |
          $families = "VX-API", "BlackBone", "SysWhispers", "sqlite3", "liblzma", "lz4"
          $present = $families | Where-Object { Test-Path "data/$_" }
          if (-not $present) { throw "no reference data was produced" }
          foreach ($family in $present) {
            python scripts/build_corpus.py validate "data/$family"
            if ($LASTEXITCODE -ne 0) { throw "validation failed for $family" }
          }

      # Only on success, and only the files the previous step left behind. An
      # always() upload of a red run published the committed artefacts of
      # whichever recipe had just failed, indistinguishable from freshly built
      # ones - a maintainer harvesting that would have re-committed bytes
      # nothing regenerated.
      - name: Upload reference data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reference-data-${{ matrix.arch }}
          path: |
            data/VX-API/**
            data/BlackBone/**
            data/SysWhispers/**
            data/sqlite3/**
            data/liblzma/**
            data/lz4/**
            !data/*/provenance.json
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: build/*.log
          if-no-files-found: ignore
