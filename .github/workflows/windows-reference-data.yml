name: Windows reference data

# Scratch probe: install older MSVC toolsets with the Build Tools bootstrappers
# and measure their runtime libraries. Not for main.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: Recipes to build (space separated); empty = measure only
        required: false
        default: ""
      mode:
        description: measure or build
        required: false
        default: measure

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --quiet -r scripts/requirements.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x64' && 'amd64' || 'x86' }}
      - name: Disk and instances before
        shell: pwsh
        run: |
          Get-PSDrive C | Format-List Used,Free
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json | Out-String | Write-Host
          Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC" | Select-Object -ExpandProperty FullName

      # Evergreen bootstrappers: the sha256 observed when this was written is
      # pinned, the payloads they then download are not.
      - name: Install VS 2017 toolsets and VS 2015 (v140)
        id: vs15
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $url = 'https://aka.ms/vs/15/release/vs_buildtools.exe'
          $pin = '79166ebaee58c28f280a7d810af3557a8a3e3f7d2ac298e20504d36d6bf6b3ae'
          $exe = Join-Path $env:RUNNER_TEMP 'vs15_buildtools.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "INSTALLER vs15 sha256=$sha size=$((Get-Item $exe).Length)"
          if ($sha -ne $pin) { throw "vs15 installer sha256 $sha differs from the pinned $pin" }
          $components = 'Microsoft.VisualStudio.Component.VC.140',
            'Microsoft.VisualStudio.Component.VC.Tools.14.11',
            'Microsoft.VisualStudio.Component.VC.Tools.14.12',
            'Microsoft.VisualStudio.Component.VC.Tools.14.13',
            'Microsoft.VisualStudio.Component.VC.Tools.14.14',
            'Microsoft.VisualStudio.Component.VC.Tools.14.15',
            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            'Microsoft.VisualStudio.Component.VC.ATLMFC'
          $argv = @('--quiet','--wait','--norestart','--nocache','--installPath','C:\BT\vs15')
          foreach ($c in $components) { $argv += @('--add', $c) }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru
          Write-Host "INSTALL vs15 exit=$($p.ExitCode) seconds=$([int]$sw.Elapsed.TotalSeconds)"
          Get-PSDrive C | Format-List Used,Free
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Get-ChildItem "$env:TEMP\dd_*.log" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "::group::$($_.Name) (errors)"
              Select-String -Path $_.FullName -Pattern 'Error|Failed|error:' | Select-Object -Last 40 | ForEach-Object { $_.Line }
              Write-Host "::endgroup::"
            }
            throw "vs15 install exit $($p.ExitCode)"
          }

      - name: Install VS 2019 toolsets 14.20 to 14.28
        id: vs16
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $url = 'https://aka.ms/vs/16/release/vs_buildtools.exe'
          $pin = 'a45ed70227e34a2144f3ce30019607ee8df16ca0d587f3fc78d01717c36dc137'
          $exe = Join-Path $env:RUNNER_TEMP 'vs16_buildtools.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "INSTALLER vs16 sha256=$sha size=$((Get-Item $exe).Length)"
          if ($sha -ne $pin) { throw "vs16 installer sha256 $sha differs from the pinned $pin" }
          $toolsets = '14.20','14.21','14.22','14.23','14.24','14.25','14.26','14.27','14.28','14.28.16.9'
          $argv = @('--quiet','--wait','--norestart','--nocache','--installPath','C:\BT\vs16')
          foreach ($t in $toolsets) {
            foreach ($s in 'x86.x64','ATL','MFC') {
              $argv += @('--add', "Microsoft.VisualStudio.Component.VC.$t.$s")
            }
          }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru
          Write-Host "INSTALL vs16 exit=$($p.ExitCode) seconds=$([int]$sw.Elapsed.TotalSeconds)"
          Get-PSDrive C | Format-List Used,Free
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Get-ChildItem "$env:TEMP\dd_*.log" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "::group::$($_.Name) (errors)"
              Select-String -Path $_.FullName -Pattern 'Error|Failed|error:' | Select-Object -Last 40 | ForEach-Object { $_.Line }
              Write-Host "::endgroup::"
            }
            throw "vs16 install exit $($p.ExitCode)"
          }

      - name: What got installed
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Get-ChildItem C:\BT -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Get-ChildItem C:\BT\*\VC\Tools\MSVC -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio 14.0\VC" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json | Out-String | Write-Host
          python scripts/corpus/crawl_vclib.py --list > toolsets-list.json
          Get-Content toolsets-list.json -TotalCount 400

      - name: Measure the toolsets
        if: ${{ !cancelled() && github.event.inputs.mode != 'build' }}
        shell: pwsh
        run: |
          python scripts/scratch/measure_oldtoolsets.py ${{ matrix.arch }} hashes 2>&1 | Tee-Object -FilePath measure.log
          exit 0

      - name: Build recipes
        if: ${{ !cancelled() && github.event.inputs.mode == 'build' }}
        id: build
        shell: pwsh
        run: |
          $recipes = @("${{ github.event.inputs.recipes }}".Split(" ") | Where-Object { $_ })
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python scripts/build_corpus.py build $recipes 2>&1 | Tee-Object -FilePath build/build-output.txt
          exit 0

      - name: Upload measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: oldtoolsets-${{ matrix.arch }}
          path: |
            hashes/*.json
            !hashes/work_*/**
            hashes/work_*/*.inputs.json
            hashes/work_*/*.link.log
            measure.log
            toolsets-list.json
            build/
          if-no-files-found: ignore
