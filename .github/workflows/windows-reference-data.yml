name: Golang stdlib coverage (scratch)

# Scratch-branch only, never merged. Stored under the file name of the existing
# windows-reference-data.yml because workflow_dispatch can only address a
# workflow that exists on the default branch; a dispatch with ref=<scratch
# branch> runs the file as it is on that branch.
#
# Runs scripts/golang/build_references.sh (the generator behind the Windows
# Golang references) for linux/386 and linux/amd64 of every Go release in the
# matrix and uploads the .7z/.mcrit pair plus a build record per image.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: Go versions to build (space separated, e.g. "1.19.13 1.26.8"; empty = all eight)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: "1.26.9", goos: linux, goarch: "386", naming: ""}
          - {version: "1.26.9", goos: linux, goarch: amd64, naming: ""}
          - {version: "1.26.10", goos: linux, goarch: "386", naming: ""}
          - {version: "1.26.10", goos: linux, goarch: amd64, naming: ""}
          - {version: "1.22.12", goos: windows, goarch: amd64, naming: named-os}
          - {version: "1.23.12", goos: windows, goarch: amd64, naming: named-os}
          - {version: "1.24.13", goos: windows, goarch: amd64, naming: named-os}
          - {version: "1.25.14", goos: windows, goarch: amd64, naming: named-os}
          - {version: "1.26.8", goos: windows, goarch: amd64, naming: named-os}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Linux reference data is disassembled with a SMDA that contains the
      # Go 1.22+ type-switch jump table bound (danielplohmann/smda#363, fixed
      # in 5.0.0 and later); the pins in scripts/requirements.txt are older.
      - name: Install analysis dependencies
        run: python -m pip install --quiet smda==5.0.2 mcrit==1.16.0 py7zr

      - name: Build
        env:
          VERSION: ${{ matrix.version }}
          GOARCH: ${{ matrix.goarch }}
          GOOS_T: ${{ matrix.goos }}
          NAMING: ${{ matrix.naming }}
          REQUESTED: ${{ github.event.inputs.recipes }}
        run: |
          if [ -n "$REQUESTED" ]; then
            case " $REQUESTED " in *" $VERSION "*) ;; *) echo "not requested"; exit 0 ;; esac
          fi
          WORK=$RUNNER_TEMP/gorefs
          mkdir -p "$WORK" out
          bash scripts/golang/build_references.sh "$VERSION" "$GOOS_T" "$GOARCH" "$WORK" $NAMING 2>&1 | tee out/build-output.txt
          BUILD=$WORK/build/go${VERSION}_${GOOS_T}_${GOARCH}
          cp "$BUILD"/golang_*.7z "$BUILD"/golang_*.mcrit out/
          export PATH=$WORK/toolchains/go$VERSION/bin:$PATH
          python - "$BUILD" "$VERSION" "$GOARCH" "$GOOS_T" <<'PY'
          import glob, hashlib, json, os, subprocess, sys
          build, version, goarch, goos = sys.argv[1:5]
          binary = glob.glob(os.path.join(build, "stdcov_go*"))
          binary = [b for b in binary if not b.endswith((".smda", ".7z", ".mcrit"))][0]
          rec = {
              "go_version": subprocess.run(["go", "version"], capture_output=True, text=True).stdout.strip(),
              "binary": os.path.basename(binary),
              "binary_size": os.path.getsize(binary),
              "binary_sha256": hashlib.sha256(open(binary, "rb").read()).hexdigest(),
          }
          import importlib.metadata as md
          rec["smda"] = md.version("smda"); rec["mcrit"] = md.version("mcrit")
          smda = glob.glob(os.path.join(build, "golang_*.smda"))[0]
          d = json.load(open(smda))
          fn = list(d["xcfg"].values())
          rec["report"] = os.path.basename(smda)
          rec["status"] = d["status"]
          rec["num_functions"] = len(fn)
          rec["named"] = sum(1 for f in fn if f.get("metadata", {}).get("function_name"))
          rec["statistics"] = d["statistics"]
          rec["smda_metadata"] = {k: d["metadata"].get(k) for k in ("family", "version", "is_library", "filename")}
          json.dump(rec, open("out/record_%s_%s_%s.json" % (version, goos, goarch), "w"), indent=2, sort_keys=True)
          print(json.dumps(rec, indent=2, sort_keys=True))
          PY
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: golang-${{ matrix.goos }}-${{ matrix.version }}-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error
