name: Windows reference data

# Generates reference data for the projects that cannot be built with GCC.
#
# VX-API needs ATL, BlackBone needs ATL and the DIA SDK, and SysWhispers v1
# emits MASM that neither nasm nor GAS will assemble. The windows-2022 runner
# image carries Visual Studio 2022 with ATL and MFC, four Windows SDKs,
# ml/ml64 and the WDK, which covers all of them.
#
# The same scripts/build_corpus.py drives this as the Linux side; only the
# toolchain differs. Results are uploaded as artifacts rather than committed,
# so a maintainer reviews them before they enter the corpus.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: Recipes to build (space separated, or "all-msvc")
        required: false
        default: all-msvc
  pull_request:
    paths:
      - scripts/corpus/recipes/vxapi.py
      - scripts/corpus/recipes/blackbone.py
      - scripts/corpus/recipes/syswhispers.py
      - scripts/corpus/toolchain.py
      - .github/workflows/windows-reference-data.yml

permissions:
  contents: read

# Each push supersedes the last, and these jobs take minutes of runner time
# building real software. Without this, a quick succession of fixes leaves
# several runs racing on commits nobody is waiting for any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    strategy:
      # One architecture failing should not hide the other's result.
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: python -m pip install --quiet -r scripts/requirements.txt

      # Puts cl, link, ml/ml64, rc and msbuild on PATH for the chosen target.
      # scripts/corpus/toolchain.py registers the MSVC toolchain from that.
      - name: Set up MSVC (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x64' && 'amd64' || 'x86' }}

      - name: Show detected toolchains
        run: python scripts/build_corpus.py list

      - name: Build
        shell: pwsh
        run: |
          $requested = "${{ github.event.inputs.recipes }}"
          if (-not $requested -or $requested -eq "all-msvc") {
            # SysWhispers v1 is x64-only: its generator emits MASM for x64.
            $requested = if ("${{ matrix.arch }}" -eq "x64") {
              "VX-API_2.01.015 BlackBone_2023-07-17 SysWhispers_2021-07-06"
            } else {
              "VX-API_2.01.015 BlackBone_2023-07-17"
            }
          }
          python scripts/build_corpus.py build $requested.Split(" ")

      # Build output goes to build/*.log rather than stdout, so a failure
      # otherwise shows only which command failed and not why. Surfacing the
      # tail of each log here is what makes a red run diagnosable from the
      # job page alone.
      - name: Show build logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem build/*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group::$($_.Name)"
            Get-Content $_.FullName -Tail 60
            Write-Host "::endgroup::"
          }

      # Scoped to the families this workflow produces. Validating all of data/
      # would also re-report the twelve known defects in the pre-existing MSVC
      # entries, so the job could never go green on its own work.
      - name: Validate
        if: always()
        shell: pwsh
        run: |
          $families = "VX-API", "BlackBone", "SysWhispers"
          $present = $families | Where-Object { Test-Path "data/$_" }
          if (-not $present) { throw "no reference data was produced" }
          foreach ($family in $present) {
            python scripts/build_corpus.py validate "data/$family"
            if ($LASTEXITCODE -ne 0) { throw "validation failed for $family" }
          }

      # Also scoped: data/ holds the whole committed corpus, and uploading it
      # wholesale pushes gigabytes of unchanged files through every run.
      - name: Upload reference data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-data-${{ matrix.arch }}
          path: |
            data/VX-API/**
            data/BlackBone/**
            data/SysWhispers/**
          if-no-files-found: warn

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: build/*.log
          if-no-files-found: ignore
