name: Tailcat Go build (scratch)

# Scratch-branch only, never merged. Stored under the file name of the
# existing windows-reference-data.yml because workflow_dispatch can only
# address a workflow that exists on the default branch; a dispatch with
# ref=<scratch branch> runs the file as it is on that branch.
#
# Builds the tailcat recipes (Go cross-compiled on Linux for windows/linux,
# amd64/386) on an ubuntu runner, one job per architecture, and uploads the
# result as reference-data-<arch> for import_ci_artifacts.py.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: Recipes to build (space separated, e.g. tailcat_0.4.0 tailcat_0.5.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
            data/tailcat
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bootstrap go only; the recipes pin GOTOOLCHAIN=go1.27.1, which the go
      # command fetches and verifies through the module proxy and sumdb.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false

      - name: Install analysis dependencies and cross compilers
        run: |
          python -m pip install --quiet smda==5.0.2 mcrit==1.16.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-x86-64 g++-mingw-w64-i686 p7zip-full
          gcc --version | head -1
          go version

      - name: Record the go1.27.1 tarball digest
        run: |
          curl -fsSL -o /tmp/go1.27.1.tar.gz https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
          echo "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  /tmp/go1.27.1.tar.gz" | sha256sum -c -
          rm /tmp/go1.27.1.tar.gz

      - name: Show recipes
        run: python scripts/build_corpus.py list | grep -i tailcat

      - name: Build
        id: build
        env:
          REQUESTED: ${{ github.event.inputs.recipes }}
          ARCH: ${{ matrix.arch }}
          MCRIT_DATA_WORK_DIR: ${{ github.workspace }}/build
        run: |
          mkdir -p build
          set +e
          python scripts/build_corpus.py build $REQUESTED --toolchain mingw_$ARCH --toolchain linux_$ARCH 2>&1 | tee build/build-output.txt
          code=${PIPESTATUS[0]}
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scope the artefacts to what this job produced
        id: scope
        env:
          REQUESTED: ${{ github.event.inputs.recipes }}
        run: |
          python - "${{ matrix.arch }}" <<'PY'
          import json, os, sys
          arch = sys.argv[1]
          versions = {r.split("_", 1)[1] for r in os.environ["REQUESTED"].split()}
          root = "data/tailcat"
          path = os.path.join(root, "provenance.json")
          records = json.load(open(path, encoding="utf-8"))
          mine = {k: v for k, v in records.items()
                  if v.get("version") in versions and v.get("architecture") == arch}
          if not mine:
              sys.exit("the build produced no artefacts for %s" % arch)
          print("produced this run:", ", ".join(sorted(mine)))
          for name in ("provenance.json", "provenance.%s.json" % arch):
              with open(os.path.join(root, name), "w", encoding="utf-8") as handle:
                  json.dump(mine, handle, indent=2, sort_keys=True)
                  handle.write("\n")
          for dirpath, _, names in os.walk(root):
              for name in names:
                  if name.endswith((".7z", ".mcrit")) and name.rsplit(".", 1)[0] not in mine:
                      os.remove(os.path.join(dirpath, name))
          PY

      - name: Validate
        if: ${{ steps.scope.outcome == 'success' }}
        run: python scripts/build_corpus.py validate data/tailcat

      - name: Upload reference data
        if: ${{ steps.scope.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: reference-data-${{ matrix.arch }}
          path: |
            data/tailcat/**
            !data/tailcat/provenance.json
          if-no-files-found: error

      - name: Show log tails
        if: ${{ !cancelled() }}
        run: |
          for f in build/*.log; do echo "::group::$f"; tail -n 80 "$f"; echo "::endgroup::"; done || true

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the job if any recipe failed
        if: ${{ !cancelled() && steps.build.outputs.exit-code != '0' }}
        run: |
          grep -E '^FAILED' build/build-output.txt || true
          exit 1
