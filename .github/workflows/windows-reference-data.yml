name: Windows reference data

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: unused
        required: false
        default: none

permissions:
  contents: read

jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2019, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Inventory
        shell: pwsh
        run: |
          Write-Host "OS: ${{ matrix.os }}"
          $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vsw -all -products * -format json | ForEach-Object { $_ } | Select-String -Pattern '"(installationPath|installationVersion|displayName|productId)"'
          $roots = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*" -Directory -ErrorAction SilentlyContinue
          foreach ($r in $roots) {
            Write-Host "=== VS root $($r.FullName)"
            Get-ChildItem "$($r.FullName)\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "TOOLSET $($_.Name)" }
            Get-ChildItem "$($r.FullName)\VC\Tools\MSVC\*\lib" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "LIBDIR $($_.FullName)"
              Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                $f = @(Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue)
                $mb = [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,1)
                Write-Host ("   {0}  files={1} MB={2}" -f $_.FullName.Replace($r.FullName,''), $f.Count, $mb)
              }
            }
            Get-ChildItem "$($r.FullName)\VC\Tools\MSVC\*\atlmfc\lib" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $f = @(Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue)
              Write-Host ("   ATLMFC {0} files={1} MB={2}" -f $_.FullName.Replace($r.FullName,''), $f.Count, [math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,1))
            }
            Write-Host "--- Auxiliary"
            Get-ChildItem "$($r.FullName)\VC\Auxiliary" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "AUX $($_.FullName)" }
            Get-ChildItem "$($r.FullName)\VC\Auxiliary\VS\lib" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Host ("AUXLIB {0} {1}" -f $_.FullName.Replace($r.FullName,''), $_.Length) }
          }
          Write-Host "=== Windows Kits"
          Get-ChildItem "C:\Program Files*\Windows Kits" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "KIT $($_.FullName)" }
          Get-ChildItem "C:\Program Files*\Windows Kits\10\Lib" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "SDKLIB $($_.FullName)"
            Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $d = $_
              Get-ChildItem $d.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                $f = @(Get-ChildItem $_.FullName -File -ErrorAction SilentlyContinue)
                Write-Host ("   {0}\{1}  files={2} MB={3}" -f $d.Name,$_.Name,$f.Count,[math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB,1))
              }
            }
          }
          Get-ChildItem "C:\Program Files*\Windows Kits\10\Lib\*\ucrt\*\*" -Include libucrt*.lib,libcmt*.lib,ucrt*.lib -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("UCRTLIB {0} {1}" -f $_.FullName,$_.Length) }
          Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\lib\x64\*.lib" -ErrorAction SilentlyContinue | Select-Object -First 400 | ForEach-Object { Write-Host ("X64LIB {0} {1}" -f $_.Name,$_.Length) }
          Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\lib\x64\*.obj" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("X64OBJ {0} {1}" -f $_.Name,$_.Length) }
          Write-Host "=== all installed VS workloads/components (count)"
          & $vsw -all -products * -format json -include packages 2>$null | Select-String 'Microsoft.VisualStudio.Component.VC.(1[0-9]\.|Tools|ATL|MFC|Runtime)' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 80
