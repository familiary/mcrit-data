name: Linux cross build (scratch)

# Scratch-branch only, never merged. Stored under the file name of the
# existing windows-reference-data.yml because workflow_dispatch can only
# address a workflow that exists on the default branch; a dispatch with
# ref=<scratch branch> runs the file as it is on that branch.
#
# Builds the requested recipes (Go or Rust cross-compiled on Linux for the
# mingw_* and linux_* toolchain ids) on an ubuntu runner, one job per recipe
# and architecture, and uploads each result as reference-data-<recipe>-<arch>
# for import_ci_artifacts.py.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: Recipes to build (space separated)
        required: true
      families:
        description: data/ families to check out (space separated)
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      recipes: ${{ steps.plan.outputs.recipes }}
    steps:
      - id: plan
        env:
          REQUESTED: ${{ github.event.inputs.recipes }}
        run: |
          python3 -c 'import json,os; print("recipes=" + json.dumps(os.environ["REQUESTED"].split()))' >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.plan.outputs.recipes) }}
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - name: Sparse checkout of scripts and the families
        env:
          FAMILIES: ${{ github.event.inputs.families }}
        run: |
          dirs="scripts"
          for f in $FAMILIES; do dirs="$dirs data/$f"; done
          git sparse-checkout set --cone .github $dirs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bootstrap go only; a recipe that needs another release pins it with
      # GOTOOLCHAIN, which the go command fetches and verifies through the
      # module proxy and the checksum database.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false

      - name: Install analysis dependencies and cross compilers
        run: |
          python -m pip install --quiet smda==5.0.2 mcrit==1.16.0
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-x86-64 g++-mingw-w64-i686 p7zip-full pkg-config libssl-dev libssl-dev:i386
          gcc --version | head -1
          go version

      - name: Show recipe
        run: python scripts/build_corpus.py list | grep -F "${{ matrix.recipe }}" || true

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          MCRIT_DATA_WORK_DIR: ${{ github.workspace }}/build
        run: |
          mkdir -p build
          set +e
          # Only the toolchains the recipe declares for this architecture:
          # build_corpus.py passes --toolchain through to run_recipe as given.
          TCS=$(python -c "import sys; sys.path.insert(0,'scripts'); from corpus import recipes; r=recipes.get(sys.argv[1]); print(' '.join('--toolchain '+t for t in r.toolchains if t.endswith('_'+sys.argv[2]) and t.split('_')[0] in ('mingw','linux')))" "${{ matrix.recipe }}" "$ARCH")
          echo "toolchains: $TCS"
          if [ -z "$TCS" ]; then echo "nothing to build for $ARCH"; exit 0; fi
          python scripts/build_corpus.py build "${{ matrix.recipe }}" $TCS 2>&1 | tee build/build-output.txt
          echo "exit ${PIPESTATUS[0]}"
          for f in build/*.log; do echo "== $f"; tail -60 "$f"; done
          exit 0

      - name: Scope the artefacts to what this job produced
        id: scope
        run: |
          python - "${{ matrix.recipe }}" "${{ matrix.arch }}" <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from corpus import recipes
          name, arch = sys.argv[1], sys.argv[2]
          recipe = recipes.get(name)
          root = os.path.join("data", recipe.family)
          path = os.path.join(root, "provenance.json")
          records = json.load(open(path, encoding="utf-8"))
          mine = {k: v for k, v in records.items()
                  if v.get("version") == recipe.version and v.get("architecture") == arch}
          if not mine:
              sys.exit("the build produced no artefacts for %s" % arch)
          print("produced this run:", ", ".join(sorted(mine)))
          with open(os.path.join(root, "provenance.%s.json" % arch), "w", encoding="utf-8") as handle:
              json.dump(mine, handle, indent=2, sort_keys=True)
              handle.write("\n")
          os.remove(path)
          for dirpath, _, names in os.walk(root):
              for n in names:
                  if n.endswith((".7z", ".mcrit")) and n.rsplit(".", 1)[0] not in mine:
                      os.remove(os.path.join(dirpath, n))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("family=%s\n" % recipe.family)
          PY

      - name: Upload reference data
        if: ${{ steps.scope.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: reference-data-${{ matrix.recipe }}-${{ matrix.arch }}
          path: data/${{ steps.scope.outputs.family }}/**
          if-no-files-found: error
