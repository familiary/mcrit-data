name: Aboriginal source build (scratch)

# Scratch-branch only, never merged. It is stored under the file name of the
# existing windows-reference-data.yml because workflow_dispatch can only
# address a workflow that exists on the default branch; a dispatch with
# ref=<scratch branch> runs the file as it is on that branch.
#
# Builds the Linux userland recipes from scripts/corpus/recipes/
# aboriginal_source.py (Aboriginal Linux / Firmware Linux built from source in
# an old Ubuntu container) on a plain ubuntu runner, one job per architecture,
# and uploads the result as reference-data-<arch> for import_ci_artifacts.py.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: Recipes to build (space separated; names ending _x86/_x64)
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
            data/musl
            data/uClibc
          sparse-checkout-cone-mode: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Linux reference data was produced with these versions (the pins in
      # scripts/requirements.txt are the older Windows-leg ones).
      - name: Install analysis dependencies and the link driver
        run: |
          python -m pip install --quiet smda==5.0.2 mcrit==1.16.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 gcc-14-multilib p7zip-full
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          gcc --version | head -1
          7z | head -2

      - name: Pre-pull the host image and record its digest
        run: |
          docker pull ubuntu:14.04
          docker image inspect ubuntu:14.04 --format 'host image id={{.Id}} digests={{.RepoDigests}}'

      - name: Show toolchains
        run: python scripts/build_corpus.py list | grep -iE 'toolchains|aboriginal' || true

      - name: Build
        id: build
        env:
          REQUESTED: ${{ github.event.inputs.recipes }}
          ARCH: ${{ matrix.arch }}
          MCRIT_DATA_WORK_DIR: ${{ github.workspace }}/build
        run: |
          mkdir -p build
          mine=""
          for r in $REQUESTED; do
            case "$r" in *_"$ARCH") mine="$mine $r" ;; esac
          done
          echo "recipes for $ARCH: $mine"
          [ -n "$mine" ] || { echo "no recipe for $ARCH"; exit 1; }
          set +e
          python scripts/build_corpus.py build $mine 2>&1 | tee build/build-output.txt
          code=${PIPESTATUS[0]}
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scope the artefacts to what this job produced
        id: scope
        run: |
          python - "${{ matrix.arch }}" <<'PY'
          import json, os, re, sys
          arch = sys.argv[1]
          produced = set(re.findall(r"^OK\s+(\S+)",
                         open("build/build-output.txt", encoding="utf-8", errors="replace").read(), re.M))
          if not produced:
              sys.exit("the build reported no artefacts; nothing to upload")
          print("produced this run:", ", ".join(sorted(produced)))
          kept = []
          for family in ("musl", "uClibc"):
              root = os.path.join("data", family)
              if not os.path.isdir(root):
                  continue
              path = os.path.join(root, "provenance.json")
              records = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else {}
              mine = {k: v for k, v in records.items() if k in produced}
              for name in ("provenance.json", "provenance.%s.json" % arch):
                  with open(os.path.join(root, name), "w", encoding="utf-8") as handle:
                      json.dump(mine, handle, indent=2, sort_keys=True)
                      handle.write("\n")
              survivors = 0
              for dirpath, _, names in os.walk(root):
                  for name in names:
                      if not name.endswith((".7z", ".mcrit")):
                          continue
                      stem = name.rsplit(".", 1)[0]
                      if stem in produced:
                          survivors += 1
                      else:
                          os.remove(os.path.join(dirpath, name))
              if survivors:
                  kept.append(family)
          if not kept:
              sys.exit("nothing landed in musl/uClibc")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("families=%s\n" % " ".join(kept))
              out.write("upload-paths<<PATHS\n")
              for family in kept:
                  out.write("data/%s/**\n" % family)
              out.write("!data/*/provenance.json\n")
              out.write("PATHS\n")
          PY

      - name: Validate
        if: ${{ steps.scope.outcome == 'success' }}
        run: |
          for f in ${{ steps.scope.outputs.families }}; do
            python scripts/build_corpus.py validate "data/$f"
          done

      - name: Upload reference data
        if: ${{ steps.scope.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: reference-data-${{ matrix.arch }}
          path: ${{ steps.scope.outputs.upload-paths }}
          if-no-files-found: error

      # The toolchain scripts log to the build log only; keep the whole log and
      # the stage logs of the Aboriginal tree for diagnosis, success or not.
      - name: Collect logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p logs
          cp build/*.log build/build-output.txt logs/ 2>/dev/null || true
          find build/sources -maxdepth 3 -type d -name logs 2>/dev/null | while read d; do
            n=$(echo "$d" | tr '/' '_'); mkdir -p "logs/$n"; cp -r "$d"/. "logs/$n"/ 2>/dev/null || true
          done
          du -sh logs || true

      - name: Show log tails
        if: ${{ !cancelled() }}
        run: |
          for f in build/*.log; do echo "::group::$f"; tail -n 120 "$f"; echo "::endgroup::"; done || true

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the job if any recipe failed
        if: ${{ !cancelled() && steps.build.outputs.exit-code != '0' }}
        run: |
          grep -E '^FAILED' build/build-output.txt || true
          exit 1
