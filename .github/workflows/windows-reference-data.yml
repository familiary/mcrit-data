name: Golang stdlib coverage variants (scratch)

# Scratch-branch only, never merged. Stored under the file name of the existing
# windows-reference-data.yml because workflow_dispatch can only address a
# workflow that exists on the default branch.
#
# Runs scripts/golang/build_variant.sh (cgo-enabled and race-instrumented
# builds of the stdlib coverage driver) and uploads the .7z/.mcrit pair, the
# driver-free report counts and the build log per image.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: unused
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: cgo, goos: linux, goarch: "386"}
          - {variant: cgo, goos: linux, goarch: amd64}
          - {variant: cgo, goos: windows, goarch: "386"}
          - {variant: cgo, goos: windows, goarch: amd64}
          - {variant: race, goos: linux, goarch: amd64}
          - {variant: race, goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies and C compilers
        run: |
          python -m pip install --quiet smda==5.0.2 mcrit==1.16.0 py7zr
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
          gcc --version | head -1; x86_64-w64-mingw32-gcc --version | head -1
      - name: Build
        env:
          VARIANT: ${{ matrix.variant }}
          GOOS_T: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          WORK=$RUNNER_TEMP/gorefs
          mkdir -p "$WORK" out
          bash scripts/golang/build_variant.sh 1.27.3 "$GOOS_T" "$GOARCH" "$WORK" "$VARIANT" 2>&1 | tee out/build-output.txt
          BUILD=$WORK/build/go1.27.3_${VARIANT}_${GOOS_T}_${GOARCH}
          cp "$BUILD"/golang_*.7z "$BUILD"/golang_*.mcrit out/
          ls -la out
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: golang-${{ matrix.variant }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error
