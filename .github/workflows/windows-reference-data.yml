name: Windows reference data

# Scratch workflow for LibreSSL 3.1.0 with the v141_xp toolset (tracker #61).
# Dispatch only. probe-vs15 installs the VS 2017 Build Tools with the VC
# Tools workload and builds a hello.c through MSBuild with -T v141_xp on both
# architectures; build-v141xp runs only when that passed. ATL is installed
# so the glue baseline's ATL probes build (run 42686111161 lacked atlbase.h).
on:
  workflow_dispatch:
    inputs:
      recipes:
        description: Recipes to build (space separated)
        required: true
        default: LibreSSL_3.1.0_msvc_v141xp

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-vs15:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Install VS 2017 Build Tools (VC Tools workload, 14.16, WinXP)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $url = 'https://aka.ms/vs/15/release/vs_buildtools.exe'
          $pin = '79166ebaee58c28f280a7d810af3557a8a3e3f7d2ac298e20504d36d6bf6b3ae'
          $exe = Join-Path $env:RUNNER_TEMP 'vs15_buildtools.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "INSTALLER vs15 sha256=$sha"
          if ($sha -ne $pin) { throw "vs15 installer sha256 $sha differs from the pinned $pin" }
          $argv = @('--quiet','--wait','--norestart','--nocache','--installPath','C:\BT\vs15',
                    '--add','Microsoft.VisualStudio.Workload.VCTools',
                    '--add','Microsoft.VisualStudio.Component.VC.CoreBuildTools',
                    '--add','Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                    '--add','Microsoft.VisualStudio.Component.WinXP',
                    '--add','Microsoft.VisualStudio.Component.VC.ATL')
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru
          Write-Host "INSTALL vs15 exit=$($p.ExitCode) seconds=$([int]$sw.Elapsed.TotalSeconds)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Get-ChildItem "$env:TEMP\dd_*.log" -ErrorAction SilentlyContinue | ForEach-Object {
              Select-String -Path $_.FullName -Pattern 'Error|Failed|error:' | Select-Object -Last 40 | ForEach-Object { $_.Line }
            }
            throw "vs15 install exit $($p.ExitCode)"
          }
          Get-ChildItem C:\BT\vs15\VC\Tools\MSVC | ForEach-Object { Write-Host "VCTOOLS $($_.FullName)" }
          Write-Host "atlbase.h present: $(Test-Path 'C:\BT\vs15\VC\Tools\MSVC\14.16.27023\atlmfc\include\atlbase.h')"
          Get-ChildItem "C:\BT\vs15\Common7\IDE\VC\VCTargets\Platforms\*\PlatformToolsets\*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "TOOLSET $($_.FullName)" }
          Get-ChildItem C:\BT\vs15\Common7\Tools\vsdevcmd\ext | ForEach-Object { Write-Host "VSDEVCMD-EXT $($_.Name)" }
          Write-Host "Microsoft.Cpp.Default.props present: $(Test-Path 'C:\BT\vs15\Common7\IDE\VC\VCTargets\Microsoft.Cpp.Default.props')"
          Get-ChildItem "C:\Program Files (x86)\Microsoft SDKs\Windows" | ForEach-Object { Write-Host "SDK $($_.FullName)" }
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | ForEach-Object { Write-Host "KIT10 $($_.Name)" }
          & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -all -products * -format text -property installationPath

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: CMake 3.31.6
        run: |
          python -m pip install --quiet cmake==3.31.6
          where cmake
          cmake --version

      - name: vcvarsall x86 puts cl 19.16 on PATH
        shell: cmd
        run: |
          call C:\BT\vs15\VC\Auxiliary\Build\vcvarsall.bat x86 || exit /b 1
          where cl || exit /b 1
          cl 2>&1 | findstr /c:"Version 19.16." || exit /b 1
          echo VCToolsVersion=%VCToolsVersion% WindowsSDKVersion=%WindowsSDKVersion% UCRTVersion=%UCRTVersion%

      - name: vcvarsall amd64 puts cl 19.16 on PATH
        shell: cmd
        run: |
          call C:\BT\vs15\VC\Auxiliary\Build\vcvarsall.bat amd64 || exit /b 1
          where cl || exit /b 1
          cl 2>&1 | findstr /c:"Version 19.16." || exit /b 1
          echo VCToolsVersion=%VCToolsVersion% WindowsSDKVersion=%WindowsSDKVersion% UCRTVersion=%UCRTVersion%

      - name: hello.c through MSBuild with -T v141_xp (both architectures) and -T v141 (x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hello | Out-Null
          Set-Content hello/hello.c "#include <stdio.h>`r`nint main(void) { printf(""hello %d\n"", _MSC_FULL_VER); return 0; }`r`n"
          Set-Content hello/CMakeLists.txt "cmake_minimum_required(VERSION 3.15)`r`nproject(hello C)`r`nadd_executable(hello hello.c)`r`n"
          $fail = 0
          foreach ($c in @(@('x86','Visual Studio 15 2017','-A','Win32','v141_xp'),
                           @('x64','Visual Studio 15 2017 Win64','','','v141_xp'),
                           @('x64v141','Visual Studio 15 2017 Win64','','','v141'))) {
            $tag, $gen, $aflag, $aval, $ts = $c
            $b = "hello/build-$tag"
            $cfg = @('-S','hello','-B',$b,'-G',$gen,'-T',$ts,'-DCMAKE_GENERATOR_INSTANCE=C:/BT/vs15')
            if ($aflag) { $cfg += @($aflag, $aval) }
            Write-Host "::group::configure $tag ($gen, -T $ts)"
            cmake @cfg 2>&1 | Out-Host
            $rc = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($rc -ne 0) { Write-Host "PROBE $tag configure FAILED ($rc)"; $fail++; continue }
            Write-Host "::group::build $tag"
            $log = cmake --build $b --config Release -- /v:d 2>&1
            $rc = $LASTEXITCODE
            $log | Select-String -Pattern 'CL.exe|cl.exe /c|link.exe|_USING_V110_SDK71_|v7.1A|PlatformToolset|SUBSYSTEM|error' | Select-Object -First 30 | ForEach-Object { $_.Line }
            Write-Host "::endgroup::"
            if ($rc -ne 0) { Write-Host "PROBE $tag build FAILED ($rc)"; $log | Select-Object -Last 40 | Out-Host; $fail++; continue }
            $hx = Get-ChildItem "$b" -Recurse -Filter hello.exe | Select-Object -First 1
            $out = & $hx.FullName
            Write-Host "PROBE $tag ok: $out"
            cmd /c "call C:\BT\vs15\VC\Auxiliary\Build\vcvarsall.bat x86 >nul && dumpbin /headers `"$($hx.FullName)`"" | Select-String 'machine|subsystem version|operating system version|linker version' | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
          }
          if ($fail) { throw "$fail probe configuration(s) failed" }

  build-v141xp:
    needs: probe-vs15
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: python -m pip install --quiet -r scripts/requirements.txt

      # CMake 3.x: LibreSSL 3.1.0 picks its MASM sources only when the
      # generator name says Win64, a spelling CMake 4.0 removed.
      - name: CMake 3.31.6
        run: python -m pip install --quiet cmake==3.31.6

      - name: Install VS 2017 Build Tools (VC Tools workload, 14.16, WinXP)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $url = 'https://aka.ms/vs/15/release/vs_buildtools.exe'
          $pin = '79166ebaee58c28f280a7d810af3557a8a3e3f7d2ac298e20504d36d6bf6b3ae'
          $exe = Join-Path $env:RUNNER_TEMP 'vs15_buildtools.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "INSTALLER vs15 sha256=$sha"
          if ($sha -ne $pin) { throw "vs15 installer sha256 $sha differs from the pinned $pin" }
          $argv = @('--quiet','--wait','--norestart','--nocache','--installPath','C:\BT\vs15',
                    '--add','Microsoft.VisualStudio.Workload.VCTools',
                    '--add','Microsoft.VisualStudio.Component.VC.CoreBuildTools',
                    '--add','Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                    '--add','Microsoft.VisualStudio.Component.WinXP',
                    '--add','Microsoft.VisualStudio.Component.VC.ATL')
          $p = Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru
          Write-Host "INSTALL vs15 exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "vs15 install exit $($p.ExitCode)" }
          Get-ChildItem C:\BT\vs15\VC\Tools\MSVC | ForEach-Object { Write-Host "VCTOOLS $($_.FullName)" }
          Write-Host "atlbase.h present: $(Test-Path 'C:\BT\vs15\VC\Tools\MSVC\14.16.27023\atlmfc\include\atlbase.h')"

      # The VS 2017 install's own developer environment, exported to the
      # later steps; scripts/corpus/toolchain.py registers msvc141 from it.
      - name: VS 2017 developer environment (${{ matrix.arch }})
        shell: pwsh
        run: |
          $a = if ('${{ matrix.arch }}' -eq 'x64') { 'amd64' } else { 'x86' }
          $lines = cmd /c "call C:\BT\vs15\VC\Auxiliary\Build\vcvarsall.bat $a >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall $a failed" }
          $n = 0
          foreach ($line in $lines) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $k = $matches[1]; $v = $matches[2]
            if ($k -match '^(GITHUB_|RUNNER_|ACTIONS_)') { continue }
            if ([Environment]::GetEnvironmentVariable($k) -ceq $v) { continue }
            Add-Content -Path $env:GITHUB_ENV -Value "$k=$v"; $n++
          }
          Write-Host "exported $n variable(s)"

      - name: Show the compiler and detected toolchains
        run: |
          where cl
          cl
          where cmake
          python scripts/build_corpus.py list

      - name: Build
        id: build
        shell: pwsh
        run: |
          $recipes = @("${{ github.event.inputs.recipes }}".Split(" ") | Where-Object { $_ })
          Write-Host "building $($recipes.Count) recipe(s): $($recipes -join ', ')"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python scripts/build_corpus.py build $recipes 2>&1 |
            Tee-Object -FilePath build/build-output.txt
          $code = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exit-code=$code"
          if ($code -ne 0) {
            Write-Host ("::warning::build_corpus.py exited $code; the " +
                        "artefacts that did build are still scoped and " +
                        "uploaded, and this job is failed at the end of the run")
          }
          exit 0

      # What the job uploads has to be what the job built. data/ arrives from
      # the checkout already holding the committed artefacts of both
      # architectures, so without this the artifact is indistinguishable from
      # a harvest of whatever happened to be committed - and provenance.json
      # is per-family, not per-architecture, so unpacking both artifacts would
      # leave one leg's records overwritten by the other's copy of the file.
      #
      # That matters more now that a partly failed build still uploads: the
      # families this leg was SUPPOSED to build are pruned whether or not they
      # produced anything, so a family whose every recipe failed is emptied
      # rather than shipping the bytes the checkout carried, and only the
      # families that still hold something this run produced are named to the
      # upload and to Validate.
      - name: Scope the artefacts to what this job produced
        id: scope
        if: ${{ success() && steps.select.outputs.skipped != 'true' }}
        shell: pwsh
        run: |
          $families = python scripts/build_corpus.py list `
            --toolchain msvc_${{ matrix.arch }} --families-only
          if ($LASTEXITCODE -ne 0) {
            throw "could not enumerate the msvc_${{ matrix.arch }} families"
          }
          $families = @($families | ForEach-Object { $_.Trim() } |
                        Where-Object { $_ })
          $py = @'
          import json, os, re, sys

          produced = set(re.findall(r"^OK\s+(\S+)",
                                    open("build/build-output.txt",
                                         encoding="utf-8", errors="replace").read(),
                                    re.M))
          if not produced:
              sys.exit("the build reported no artefacts; nothing to upload")
          print("produced this run: %s" % ", ".join(sorted(produced)))

          arch = sys.argv[1]
          # The families the recipes for this leg file into, from
          # `build_corpus.py list --families-only`. Every one of them is
          # pruned, including any that produced nothing, because an unpruned
          # family would otherwise hand the upload the committed artefacts
          # this job did not rebuild.
          expected = sys.argv[2:]
          if not expected:
              sys.exit("no families were named; the recipe enumeration failed")
          print("families this leg builds: %s" % ", ".join(expected))

          # sqlite3, liblzma and lz4 also hold MinGW artefacts, which this
          # loop prunes out of the working copy along with the other
          # architecture's: what is uploaded has to be what this job built.
          # The consequence for whoever imports the result is that
          # provenance.<arch>.json for those families carries the MSVC
          # records ONLY, so it must be merged into the committed
          # provenance.json key by key - copying it over would delete the
          # MinGW records this job never rebuilt.
          kept = []
          for family in expected:
              root = os.path.join("data", family)
              if not os.path.isdir(root):
                  continue
              path = os.path.join(root, "provenance.json")
              records = {}
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as handle:
                      records = json.load(handle)
              else:
                  print("::warning::data/%s has no provenance.json; its "
                        "provenance.%s.json will be empty" % (family, arch))
              mine = {k: v for k, v in records.items() if k in produced}
              # provenance.json stays, pruned, because Validate reads it - but
              # it is not what gets uploaded. The artifact carries the
              # architecture-named copy instead, so unpacking both artifacts
              # cannot leave one leg's records overwritten by the other's.
              for name in ("provenance.json", "provenance.%s.json" % arch):
                  with open(os.path.join(root, name), "w",
                            encoding="utf-8") as handle:
                      json.dump(mine, handle, indent=2, sort_keys=True)
                      handle.write("\n")
              survivors = 0
              for dirpath, _, names in os.walk(root):
                  for name in names:
                      stem = name.rsplit(".", 1)[0]
                      if not name.endswith((".7z", ".mcrit")):
                          continue
                      if stem in produced:
                          survivors += 1
                      else:
                          os.remove(os.path.join(dirpath, name))
              if survivors:
                  kept.append(family)
              else:
                  # Not an error on its own: SysWhispers builds nothing on
                  # x86. It is also what a wholly failed family looks like,
                  # and either way there is nothing here worth uploading.
                  print("%s: nothing produced, left out of the upload" % family)

          if not kept:
              sys.exit("the build produced %d artefact(s) but none of them "
                       "landed in %s; the recipes and the families they file "
                       "into have gone out of step"
                       % (len(produced), ", ".join(expected)))
          print("uploading: %s" % ", ".join(kept))

          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              with open(out, "a", encoding="utf-8") as handle:
                  handle.write("families=%s\n" % " ".join(kept))
                  handle.write("upload-paths<<PATHS\n")
                  for family in kept:
                      handle.write("data/%s/**\n" % family)
                  handle.write("!data/*/provenance.json\n")
                  handle.write("PATHS\n")
          '@
          $py | python - "${{ matrix.arch }}" $families
          if ($LASTEXITCODE -ne 0) { throw "scoping failed" }

      # Scoped to the families this workflow produced, and now to the ones it
      # actually produced on this leg. Validating all of data/ would also
      # re-report the twelve known defects in the pre-existing MSVC entries,
      # so the job could never go green on its own work. By this point the
      # tree holds only what this job built, so this validates the run's own
      # output rather than whatever the checkout carried.
      - name: Validate
        if: ${{ success() && steps.select.outputs.skipped != 'true' }}
        shell: pwsh
        run: |
          $families = @("${{ steps.scope.outputs.families }}".Split(" ") |
                        Where-Object { $_ })
          if (-not $families) { throw "no reference data was produced" }
          foreach ($family in $families) {
            python scripts/build_corpus.py validate "data/$family"
            if ($LASTEXITCODE -ne 0) { throw "validation failed for $family" }
          }

      # Only the files the scoping step left behind, and only the families it
      # says hold something this run produced. An always() upload of a red run
      # published the committed artefacts of whichever recipe had just failed,
      # indistinguishable from freshly built ones - a maintainer harvesting
      # that would have re-committed bytes nothing regenerated. That is still
      # the rule; what changed is that the scoping step now deletes those
      # bytes, so a partly failed run can upload the part that is real.
      #
      # The artifact name must keep ending in -x86/-x64:
      # scripts/import_ci_artifacts.py reads the architecture off it and
      # refuses any record that does not match.
      - name: Upload reference data
        if: ${{ success() && steps.select.outputs.skipped != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: reference-data-v141xp-${{ matrix.arch }}
          path: ${{ steps.scope.outputs.upload-paths }}
          if-no-files-found: error

      # Build output goes to build/*.log rather than stdout, so a failure
      # otherwise shows only which command failed and not why. Surfacing the
      # tail of each log here is what makes a red run diagnosable from the
      # job page alone. It runs on a partly failed build too, where no step
      # has failed yet.
      - name: Show build logs
        if: ${{ !cancelled() && steps.build.conclusion != 'skipped'
             && steps.select.outputs.skipped != 'true'
             && (failure() || steps.build.outputs.exit-code != '0') }}
        shell: pwsh
        run: |
          Get-ChildItem build/*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group::$($_.Name)"
            Get-Content $_.FullName -Tail 60
            Write-Host "::endgroup::"
          }

      # Uploaded on a green run too, which the step above deliberately is not.
      # A recipe may now succeed while having built less than it meant to:
      # nt_wrapper compiles its five exerciser translation units with
      # allow_failure and links whatever objects resulted, so a degraded build
      # reaches this point reporting OK, with the NTW-TU-FAILED lines and the
      # object inventory that explain it sitting only in build/*.log. Showing
      # every log on the job page would drown a thirty-recipe leg; keeping the
      # logs as an artifact costs nothing and makes the degraded case
      # diagnosable after the fact. The function count printed by the build
      # step is what says a build is worth looking into.
      - name: Upload build logs
        if: ${{ !cancelled() && steps.build.conclusion != 'skipped'
             && steps.select.outputs.skipped != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-v141xp-${{ matrix.arch }}
          path: build/*.log
          if-no-files-found: ignore

      # The verdict, deliberately the last step so the summary lands on the
      # last screen of the log. Everything above is allowed to run on a
      # partly failed build so the good artefacts survive; this is what stops
      # that from reading as success. A green job hiding a broken recipe is
      # worse than losing the artefacts, so the one thing this must never do
      # is be skipped when a recipe failed.
      - name: Fail the job if any recipe failed
        if: ${{ !cancelled() && steps.build.conclusion != 'skipped'
             && steps.build.outputs.exit-code != '0' }}
        shell: pwsh
        run: |
          $code = "${{ steps.build.outputs.exit-code }}"
          $uploaded = "${{ steps.scope.outputs.families }}"
          $failed = @()
          if (Test-Path build/build-output.txt) {
            $failed = @(Get-Content build/build-output.txt |
                        Where-Object { $_ -match '^FAILED\s' })
          }
          Write-Host "----- recipes that failed on ${{ matrix.arch }} -----"
          if ($failed) {
            foreach ($line in $failed) {
              Write-Host $line
              # A literal % in a compiler message is a workflow-command escape,
              # so an unescaped one truncates the annotation it appears in.
              Write-Host ("::error::" + ($line -replace '%', '%25'))
            }
          } else {
            Write-Host ("::error::build_corpus.py exited '$code' without " +
                        "naming a failed artefact; the Build step holds the " +
                        "traceback")
          }
          if ($uploaded) {
            Write-Host ("::notice::what did build was still uploaded, as " +
                        "reference-data-${{ matrix.arch }}: $uploaded. " +
                        "import_ci_artifacts.py refuses any run that did not " +
                        "conclude success, so import it by downloading the " +
                        "artifact from this run and passing --zip.")
          } else {
            Write-Host "::notice::nothing was uploaded from this leg"
          }
          throw ("this run built a broken recipe: " +
                 "$($failed.Count) failure(s) named above, " +
                 "build_corpus.py exit '$code'")

