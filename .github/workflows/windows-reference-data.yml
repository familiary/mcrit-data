name: Network probe (scratch)

# Scratch-branch only, never merged: runs the given read-only shell lines on an
# ubuntu runner and prints the output (used to check which archived release
# URLs still answer from a network without this container's proxy limits).

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: shell lines to run
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Run
        env:
          SCRIPT: ${{ github.event.inputs.recipes }}
        run: |
          echo "$SCRIPT" > probe.sh
          cat probe.sh
          bash probe.sh 2>&1 || true
